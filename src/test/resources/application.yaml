spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  charset:
    console: UTF-8
    file: UTF-8

app:
  auth:
    token-expire-hours: 168
  iap:
    base-url: https://iap.test
    root-ca-cert-path: ${user.dir}/config/iap/RootCaG2Ecdsa.cer
    jwt:
      private-key-path: ${user.dir}/config/iap/priKey.p8
      key-id: test-kid
      issuer-id: test-iss
      app-id: test-aid
